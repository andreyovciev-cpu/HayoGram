name: Build APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout HayoGram
        uses: actions/checkout@v4
        with:
          path: HayoGram

      - name: Read upstream commit
        id: upstream
        run: echo "ref=$(cat HayoGram/patch/UPSTREAM)" >> "$GITHUB_OUTPUT"

      - name: Checkout Telegram upstream
        uses: actions/checkout@v4
        with:
          repository: DrKLO/Telegram
          ref: ${{ steps.upstream.outputs.ref }}
          path: Telegram
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install SDK 36, build-tools and NDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          fi
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"

      - name: Apply the Hayo Gram patch
        run: git -C Telegram apply ../HayoGram/patch/hayo.patch

      - name: Rebuild libprisma
        working-directory: Telegram/TMessagesProj/jni/prebuild
        run: ABIS=arm64-v8a bash build_prisma.sh

      - name: Write local.properties
        working-directory: Telegram
        env:
          APP_ID: ${{ secrets.HAYO_APP_ID }}
          APP_HASH: ${{ secrets.HAYO_APP_HASH }}
          STORE_B64: ${{ secrets.HAYO_STORE_FILE_BASE64 }}
          STORE_PASS: ${{ secrets.HAYO_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HAYO_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.HAYO_KEY_PASSWORD }}
        run: |
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "HAYO_APP_ID=${APP_ID:-4}"
            echo "HAYO_APP_HASH=${APP_HASH:-014b35b6184100b085b0d0572f9b5103}"
            if [ -n "$STORE_B64" ]; then
              echo "$STORE_B64" | base64 -d > hayogram-release.jks
              echo "HAYO_STORE_FILE=$PWD/hayogram-release.jks"
              echo "HAYO_STORE_PASSWORD=$STORE_PASS"
              echo "HAYO_KEY_ALIAS=$KEY_ALIAS"
              echo "HAYO_KEY_PASSWORD=$KEY_PASS"
            fi
          } > local.properties

      - name: Build standalone APK
        working-directory: Telegram
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HayoGram-apk
          path: Telegram/TMessagesProj_AppStandalone/build/outputs/apk/afat/standalone/*.apk
          if-no-files-found: error
