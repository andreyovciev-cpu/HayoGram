name: Publish release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: ID of the successful Build APK run
        required: true
        default: '44807854887'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download APK from the build run
        uses: actions/download-artifact@v4
        with:
          name: HayoGram-apk
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifact

      - name: Create release
        run: |
          mv artifact/app.apk HayoGram-2.0.apk
          gh release create v2.0 HayoGram-2.0.apk \
            --title "Hayo Gram 2.0" \
            --notes "A Telegram fork by Hayozimi with owner badges for @hayozimi and @zarrokk. Built from the verified patch in this repository."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
